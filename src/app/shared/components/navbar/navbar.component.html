<!-- Modal -->
<div
    class="modal fade"
    id="myModal"
    tabindex="-1"
    aria-labelledby="modalTitle"
    aria-hidden="true"
>
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">My Modal</h5>
                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                ></button>
            </div>
            <div class="modal-body">
                <app-task-form></app-task-form>
            </div>
        </div>
    </div>
</div>

<nav
    class="d-flex flex-column align-items-center bg-black border-end vh-100 py-3 shadow-sm"
    style="width: 45px"
>
    <!-- Top Icons -->
    <ul class="nav flex-column text-center">
        <li class="nav-item mb-3">
            <a
                class="nav-link text-white p-2"
                routerLink="/projects"
                title="Dashboard"
            >
                <i class="bi bi-menu-button-wide fs-5"></i>
            </a>
        </li>
        <li class="nav-item mb-3">
            <a class="nav-link text-white p-2" routerLink="/dashboard" title="Search">
                <i class="bi bi-search fs-5"></i>
            </a>
        </li>
        <li class="nav-item mb-3">
            <a
                class="nav-link text-white p-2"
                role="button"
                title="New Issue"
                data-bs-toggle="modal"
                data-bs-backdrop="static"
                data-bs-target="#myModal"
            >
                <i class="bi bi-plus-square fs-5"></i>
            </a>
        </li>
    </ul>

    <!-- Bottom Icons -->
    <div class="mt-auto d-flex flex-column align-items-center pb-3">
        <!-- Notifications -->
        <div class="dropdown mb-3">
            <a
                class="nav-link text-white p-2 dropdown-toggle"
                data-bs-toggle="dropdown"
                href="#"
                id="notificationsDropdown"
                title="Notifications"
            >
                <i class="bi bi-bell fs-5"></i>
            </a>
            <ul class="dropdown-menu dropdown-menu-end border-0 shadow-sm">
                <li><a class="dropdown-item" href="#">Some news</a></li>
                <li><a class="dropdown-item" href="#">Another news</a></li>
                <li><a class="dropdown-item" href="#">Something else</a></li>
            </ul>
        </div>

        <!-- Profile -->
        <div class="dropdown">
            <a
                class="nav-link p-2 d-flex align-items-center"
                data-bs-toggle="dropdown"
                href="#"
                id="profileDropdown"
            >
                <img
                    alt="Avatar"
                    class="rounded-circle border border-white"
                    height="30"
                    width="30"
                    src="https://mdbcdn.b-cdn.net/img/new/avatars/2.webp"
                />
            </a>
            <ul class="dropdown-menu dropdown-menu-end border-0 shadow-sm">
                <li><a class="dropdown-item" href="#">Profile</a></li>
                <li><a class="dropdown-item" href="#">Settings</a></li>
                <li><a class="dropdown-item" (click)="logout()">Logout</a></li>
            </ul>
        </div>
    </div>
</nav>
