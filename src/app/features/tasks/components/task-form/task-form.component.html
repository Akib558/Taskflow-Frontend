<div class="container py-5">
    <h2 class="mb-4 fw-bold text-center">Create a New Task</h2>

    <form [formGroup]="taskForm" (ngSubmit)="onSubmit()" class="row g-4">
        <!-- Task Type -->
        <div class="col-12">
            <label class="form-label fw-semibold">Task Type</label>
            <div class="d-flex gap-4">
                <div class="form-check">
                    <input
                        class="form-check-input"
                        type="radio"
                        formControlName="taskCategory"
                        value="parent"
                        id="taskParent"
                    />
                    <label class="form-check-label" for="taskParent">
                        Parent Task
                    </label>
                </div>
                <div class="form-check">
                    <input
                        class="form-check-input"
                        type="radio"
                        formControlName="taskCategory"
                        value="sub"
                        id="taskTypeSub"
                    />
                    <label class="form-check-label" for="taskTypeSub">
                        Sub Task
                    </label>
                </div>
            </div>
        </div>

        <!-- Parent ID -->
        <div class="col-md-6" *ngIf="isSubTask">
            <label class="form-label" for="parentId">Parent Task ID</label>
            <input
                type="number"
                class="form-control"
                id="parentId"
                placeholder="Enter Parent Task ID"
                formControlName="taskParentId"
                min="1"
            />
        </div>

        <!-- Task Title -->
        <div class="col-md-6">
            <label class="form-label">Task Title *</label>
            <input
                type="text"
                class="form-control"
                formControlName="taskTitle"
                placeholder="Enter Task Title"
            />
            <small
                class="text-danger"
                *ngIf="
                    taskForm.get('taskTitle')?.invalid &&
                    taskForm.get('taskTitle')?.touched
                "
            >
                Task title is required.
            </small>
        </div>

        <!-- Task Description -->
        <div class="col-12">
            <label class="form-label">Task Description *</label>
            <textarea
                class="form-control"
                rows="4"
                formControlName="taskDescription"
                placeholder="Enter task details"
            ></textarea>
            <small
                class="text-danger"
                *ngIf="
                    taskForm.get('taskDescription')?.invalid &&
                    taskForm.get('taskDescription')?.touched
                "
            >
                Task description is required.
            </small>
        </div>

        <!-- Status -->
        <div class="col-md-4">
            <label class="form-label">Status</label>
            <select class="form-select" formControlName="taskStatus">
                <option value="" [ngValue]="taskStatus.at(0)">Select Status</option>
                <option *ngFor="let status of taskStatus" [value]="status.id">
                    {{ status.status }}
                </option>
            </select>
        </div>

        <!-- Type -->
        <div class="col-md-4">
            <label class="form-label">Type</label>
            <select class="form-select" formControlName="taskType">
                <option value="">Select Type</option>
                <option *ngFor="let type of taskType" [value]="type.id">
                    {{ type.type }}
                </option>
            </select>
        </div>

        <!-- Priority -->
        <div class="col-md-4">
            <label class="form-label">Priority</label>
            <select class="form-select" formControlName="taskPriority">
                <option value="">Select Priority</option>
                <option *ngFor="let priority of taskPriority" [value]="priority.id">
                    {{ priority.priority }}
                </option>
            </select>
        </div>

        <!-- Submit Buttons -->
        <div class="col-12 d-flex justify-content-end gap-3 pt-3">
            <button
                type="button"
                class="btn btn-outline-secondary"
                (click)="resetForm()"
            >
                Reset
            </button>
            <button
                type="submit"
                class="btn btn-dark"
                [disabled]="taskForm.invalid"
            >
                Submit Task
            </button>
        </div>
    </form>
</div>
