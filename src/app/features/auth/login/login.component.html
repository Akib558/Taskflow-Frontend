<div class="login-container">
    <div class="login-card">
        <div class="logo">
            <svg
                width="40"
                height="40"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
            >
                <path
                    d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"
                ></path>
            </svg>
        </div>
        <h1 class="login-title">Welcome back</h1>
        <p class="login-subtitle">Please enter your credentials</p>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
            <div class="form-group">
                <input
                    type="email"
                    formControlName="email"
                    placeholder="Email address"
                    class="form-input"
                    [class.input-error]="submitted && formControls['email'].errors"
                />
                <div
                    *ngIf="submitted && formControls['email'].errors"
                    class="error-message"
                >
          <span *ngIf="formControls['email'].errors['required']"
          >Email is required</span>

                    <span *ngIf="formControls['email'].errors['email']"
                    >Email is invalid</span
                    >
                </div>
            </div>

            
            <div class="form-group password-group">
                <input
                    [type]="showPassword ? 'text' : 'password'"
                    formControlName="password"
                    placeholder="Password"
                    class="form-input"
                    [class.input-error]="submitted && formControls['password'].errors"
                />
                <button
                    type="button"
                    class="password-toggle"
                    (click)="togglePasswordVisibility()"
                    [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
                >
                    <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <path
                            *ngIf="!showPassword"
                            d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                        ></path>
                        <circle *ngIf="!showPassword" cx="12" cy="12" r="3"></circle>
                        <path
                            *ngIf="showPassword"
                            d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                        ></path>
                        <line *ngIf="showPassword" x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </button>
                <div
                    *ngIf="submitted && formControls['password'].errors"
                    class="error-message"
                >
          <span *ngIf="formControls['password'].errors['required']"
          >Password is required</span
          >
                </div>
            </div>

            <button type="submit" class="login-button">Log in</button>
        </form>
        <div class="login-footer">
            <a routerLink="/forgot-password" class="footer-link">Forgot password?</a>
            <span class="footer-divider">|</span>
            <a class="footer-link" routerLink="/register">Sign Up</a>
        </div>
    </div>
</div>
